<!DOCTYPE html>

<header>

        <ellipse cx="20" cy="25" rx="9" ry="7" fill="#FFFDF8"/>

    <nav><a href="shop.html">Dogs</a><a href="shop.html">Cats</a><a href="shop.html">Small Pets</a><a href="shop.html">Aquatics</a><a href="shop.html">Sale</a></nav>

      <a href="cart.html" class="icon-btn">🛒<span class="cart-count">3</span></a>

  </div>
</header>

<div class="auth-shell">
  <div class="auth-card" style="text-align:center;">
    <h1>Seller sign in has moved</h1>

<footer>
  <div class="wrap">
    <div class="footer-bottom" style="border-top:none; padding-top:0;">
      <span>© 2026 Happy Paws Store. All rights reserved.</span>
      <span>Privacy · Terms · Cookies</span>
    </div>
  </div>

</html>
